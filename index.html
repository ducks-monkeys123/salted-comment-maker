  :root { --navy: #004AAD; --ink: #0958A4; --bg: #eef5fb; --line: #cfe0ef; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "SC Open Sans", system-ui, sans-serif; background: var(--bg); color: #17324d; }
  header { background: var(--navy); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; font-style: italic; letter-spacing: .5px; flex: 1; }
  header button { background: #fff; color: var(--navy); }
  main { display: grid; grid-template-columns: minmax(320px, 520px) 1fr; gap: 24px; padding: 24px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--navy); margin: 0 0 12px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .editor { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .entry { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: #f8fbfe; }
  .entry-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .num { background: var(--navy); color: #fff; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .entry-head .spacer { flex: 1; }
  textarea, input[type=text] { width: 100%; font: inherit; font-weight: 400; font-size: 15px; border: 1px solid #b9cfe3; border-radius: 8px; padding: 8px 10px; background: #fff; color: #17324d; }
  textarea { min-height: 90px; resize: vertical; margin-bottom: 8px; }
  button { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; background: var(--navy); color: #fff; }
  button.ghost { background: transparent; color: var(--navy); border: 1px solid #b9cfe3; padding: 4px 9px; }
  button.ghost:disabled { opacity: .35; cursor: default; }
  button.danger { color: #b3261e; }
  .add { width: 100%; padding: 12px; }
  .hint { font-size: 13px; color: #5b7690; margin: 10px 0 0; font-weight: 400; }
  .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .page { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .page canvas { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .page-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
  .page-foot span { font-size: 13px; font-weight: 700; color: #33506b; }
  .page-foot button { padding: 5px 10px; font-size: 13px; }
  .section-title { grid-column: 1 / -1; margin: 6px 0 -6px; font-size: 14px; color: var(--navy); text-transform: uppercase; letter-spacing: 1px; }
  .empty { color: #5b7690; font-weight: 400; }
</style>
</head>
<body>
<header>
  <h1>SALTED COMMENT MAKER</h1>
  <button id="downloadAll">Download all (ZIP)</button>
</header>
<main>
  <section class="panel editor">
    <h2>Salted comments</h2>
    <div id="entries"></div>
    <button class="add" id="add">+ Add salted comment</button>
    <p class="hint">Numbers update automatically when you add, remove or reorder. Your list is saved in this browser.</p>
    <p class="hint"><button class="ghost danger" id="clearAll">Clear all</button></p>
  </section>
  <section>
    <div class="pages" id="pages"></div>
  </section>
</main>

  // ---------- drawing helpers ----------
  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function glassBox(ctx, x, y, w, h, r, shadow) {
    rrect(ctx, x + shadow, y + shadow, w, h, r);
    ctx.fillStyle = 'rgba(120,140,160,0.45)'; ctx.fill();
    rrect(ctx, x, y, w, h, r);
    ctx.fillStyle = 'rgba(255,255,255,0.68)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(150,180,200,0.95)'; ctx.stroke();
  }
  // one "6"-shaped quote mark, 27x48; flipped = closing mark
  function quoteMark(ctx, x, y, flipped) {
    ctx.save();
    if (flipped) { ctx.translate(x + 27, y + 48); ctx.rotate(Math.PI); } else ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, 48); ctx.lineTo(27, 48); ctx.lineTo(27, 26); ctx.lineTo(11, 26); ctx.lineTo(11, 19);
    ctx.quadraticCurveTo(12, 12, 19, 11); ctx.lineTo(19, 0); ctx.quadraticCurveTo(1, 3, 0, 19); ctx.closePath();
    ctx.fill(); ctx.restore();
  }
  function wrap(ctx, text, maxW) {
    const lines = [];
    for (const para of text.split(/\n/)) {
      const words = para.split(/\s+/).filter(Boolean);
      if (!words.length) { if (lines.length) lines.push(''); continue; }
      let line = words[0];
      for (let i = 1; i < words.length; i++) {
        const test = line + ' ' + words[i];
        if (ctx.measureText(test).width <= maxW) line = test; else { lines.push(line); line = words[i]; }
      }
      lines.push(line);
    }
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    return lines;
  }
  function fitText(ctx, weight, text, maxW, maxH, start, min, lhRatio) {
    let fs = start, lines;
    for (; fs >= min; fs -= 2) {
      ctx.font = `${weight} ${fs}px ${FONT}`;
      lines = wrap(ctx, text, maxW);
      if (lines.length * fs * lhRatio <= maxH && lines.every(l => ctx.measureText(l).width <= maxW)) break;
    }
    if (fs < min) { fs = min; ctx.font = `${weight} ${fs}px ${FONT}`; lines = wrap(ctx, text, maxW); }
    return { fs, lines, lh: fs * lhRatio };
  }
  function base(ctx) {
    ctx.clearRect(0, 0, W, H);
    if (bg.complete && bg.naturalWidth) ctx.drawImage(bg, 0, 0, W, H);
    else { ctx.fillStyle = '#c4e8fd'; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- comment page ----------
  function drawComment(ctx, n, text, name) {
    base(ctx);
    // main card
    glassBox(ctx, 95, 255, 1732, 643, 40, 10);
    // quote marks
    ctx.fillStyle = QUOTE;
    quoteMark(ctx, 121, 280, false); quoteMark(ctx, 158, 280, false);
    quoteMark(ctx, 1736, 812, true); quoteMark(ctx, 1772, 812, true);
    // title pill
    rrect(ctx, 561, 34, 809, 189, 46); ctx.fillStyle = NAVY; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = `italic 800 76px ${FONT}`;
    ctx.fillText('SALTED COMMENT', 967, 151);
    // number circle
    ctx.beginPath(); ctx.arc(280, 253, 68, 0, Math.PI * 2); ctx.fillStyle = NAVY; ctx.fill();
    ctx.fillStyle = '#fff';
    const ns = String(n);
    ctx.font = `700 ${ns.length > 2 ? 48 : ns.length > 1 ? 58 : 66}px ${FONT}`;
    ctx.textBaseline = 'middle';
    ctx.fillText(ns, 279, 255);
    // comment text
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const t = fitText(ctx, '800 semi-condensed', text || '', 1630, 500, 60, 30, 1.4);
    const capH = t.fs * 0.714;
    let y = 571 - ((t.lines.length - 1) * t.lh + capH) / 2 + capH;
    for (const l of t.lines) { ctx.fillText(l, 960, y); y += t.lh; }
    // name
    if (name) {
      let fs = 78; ctx.font = `800 ${fs}px ${FONT}`;
      while (ctx.measureText(name).width > 1760 && fs > 40) { fs -= 2; ctx.font = `800 ${fs}px ${FONT}`; }
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(name, 958, 1018);
    }
  }

  // ---------- summary pages ----------
  const S = { fs: 40, lh: 56, pad: 10, gap: 48, top: 40, bottom: 1040, minFs: 26 };
  function layoutSummary(ctx, list) {
    // measure each item at the standard size (shrink only if one item alone can't fit a page)
    const avail = S.bottom - S.top;
    const measured = list.map(it => {
      const twoDigit = it.n >= 10;
      const textW = 1577 - (twoDigit ? 18 : 0);
      let fs = S.fs, lh = S.lh, lines;
      for (;;) {
        ctx.font = `800 ${fs}px ${FONT}`;
        lines = wrap(ctx, it.text, textW);
        if (lines.length * lh + S.pad * 2 <= avail || fs <= S.minFs) break;
        fs -= 2; lh = Math.round(fs * 1.4);
      }
      return { ...it, fs, lh, lines, h: Math.max(1, lines.length) * lh + S.pad * 2 };
    });
    // greedy pack into pages
    const pages = []; let cur = [], used = 0;
    for (const m of measured) {
      const need = (cur.length ? S.gap : 0) + m.h;
      if (cur.length && used + need > avail) { pages.push(cur); cur = []; used = 0; }
      used += (cur.length ? S.gap : 0) + m.h; cur.push(m);
    }
    if (cur.length) pages.push(cur);
    // balance: if the last page is much emptier, pull items back from the previous page
    for (let i = pages.length - 1; i > 0; i--) {
      const h = p => p.reduce((s, m) => s + m.h, 0) + S.gap * (p.length - 1);
      while (pages[i - 1].length > 1) {
        const moved = pages[i - 1][pages[i - 1].length - 1];
        const newPrev = pages[i - 1].slice(0, -1), newCur = [moved, ...pages[i]];
        if (h(newCur) > avail || h(newCur) > h(pages[i - 1])) break;
        if (Math.abs(h(newPrev) - h(newCur)) >= Math.abs(h(pages[i - 1]) - h(pages[i]))) break;
        pages[i - 1] = newPrev; pages[i] = newCur;
      }
    }
    return pages;
  }
  function drawSummary(ctx, page) {
    base(ctx);
    const twoDigit = page.some(m => m.n >= 10);
    const bx = twoDigit ? 168 : 150, bw = 1655, tx = bx + 38, numX = twoDigit ? 126 : 108;
    const total = page.reduce((s, m) => s + m.h, 0) + S.gap * (page.length - 1);
    let y = Math.round((S.top + S.bottom) / 2 - total / 2);
    for (const m of page) {
      glassBox(ctx, bx, y, bw, m.h, 22, 6);
      ctx.textBaseline = 'middle';
      ctx.fillStyle = INK; ctx.textAlign = 'center';
      ctx.font = `bold 38px Arial, Helvetica, sans-serif`;
      ctx.fillText(String(m.n), numX, y + m.h / 2 + 2);
      ctx.textAlign = 'left'; ctx.font = `800 ${m.fs}px ${FONT}`;
      let ly = y + S.pad + m.lh / 2;
      for (const l of m.lines) { ctx.fillText(l, tx, ly); ly += m.lh; }
      y += m.h + S.gap;
    }
  }

  // ---------- editor ----------
  const entriesEl = document.getElementById('entries');
  const pagesEl = document.getElementById('pages');
  function renderEditor() {
    entriesEl.innerHTML = '';
    items.forEach((it, i) => {
      const d = document.createElement('div'); d.className = 'entry';
      d.innerHTML = `
        <div class="entry-head">
          <div class="num">${i + 1}</div><div class="spacer"></div>
          <button class="ghost" data-act="up" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="ghost" data-act="down" title="Move down" ${i === items.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="ghost danger" data-act="del" title="Remove">✕</button>
        </div>
        <textarea placeholder="Salted comment"></textarea>
        <input type="text" placeholder="Bro. &lt;First name&gt; &lt;Last name&gt;">`;
      const ta = d.querySelector('textarea'), inp = d.querySelector('input');
      ta.value = it.text; inp.value = it.name;
      ta.addEventListener('input', () => { it.text = ta.value; changed(); });
      inp.addEventListener('input', () => { it.name = inp.value; changed(); });
      d.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
        const a = b.dataset.act;
        if (a === 'up' && i > 0) [items[i - 1], items[i]] = [items[i], items[i - 1]];
        if (a === 'down' && i < items.length - 1) [items[i + 1], items[i]] = [items[i], items[i + 1]];
        if (a === 'del') { if (!confirmDelete(it)) return; items.splice(i, 1); if (!items.length) items.push({ text: '', name: '' }); }
        renderEditor(); changed(true);
      }));
      entriesEl.appendChild(d);
    });
  }
  function confirmDelete(it) { return !(it.text.trim() || it.name.trim()) || window.confirm('Remove this salted comment?'); }
  document.getElementById('add').addEventListener('click', () => {
    items.push({ text: '', name: '' }); renderEditor(); changed(true);
    const tas = entriesEl.querySelectorAll('textarea'); tas[tas.length - 1].focus();
  });
  document.getElementById('clearAll').addEventListener('click', () => {
    if (!window.confirm('Clear all salted comments?')) return;
    items = [{ text: '', name: '' }]; renderEditor(); changed(true);
  });

  // ---------- pages ----------
  let pageList = [];
  function buildPages() {
    const filled = items.map((it, i) => ({ n: 0, text: it.text.trim(), name: it.name.trim() })).filter(it => it.text);
    filled.forEach((it, i) => it.n = i + 1);
    const out = [];
    for (const it of filled) {
      out.push({ file: `Salted Comment - ${it.n}.png`, label: `Comment ${it.n}`, draw: c => drawComment(c, it.n, it.text, '') });
      out.push({ file: `Salted Comment - NAME ${it.n}.png`, label: `Comment ${it.n} · with name`, draw: c => drawComment(c, it.n, it.text, it.name) });
    }
    const mctx = document.createElement('canvas').getContext('2d');
    layoutSummary(mctx, filled).forEach((p, i) => out.push({ file: `SUMMARY ${i + 1}.png`, label: `Summary ${i + 1}`, summary: true, draw: c => drawSummary(c, p) }));
    return out;
  }
  function renderPages() {
    pageList = buildPages();
    pagesEl.innerHTML = '';
    if (!pageList.length) { pagesEl.innerHTML = '<p class="empty">Type a salted comment on the left and the pages will appear here.</p>'; return; }
    let summaryHeader = false;
    for (const p of pageList) {
      if (p.summary && !summaryHeader) { const h = document.createElement('div'); h.className = 'section-title'; h.textContent = 'Summary'; pagesEl.appendChild(h); summaryHeader = true; }
      const box = document.createElement('div'); box.className = 'page';
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      p.draw(c.getContext('2d')); p.canvas = c;
      const foot = document.createElement('div'); foot.className = 'page-foot';
      const s = document.createElement('span'); s.textContent = p.label;
      const b = document.createElement('button'); b.textContent = 'Download';
      b.addEventListener('click', () => c.toBlob(bl => downloadBlob(bl, p.file), 'image/png'));
      foot.append(s, b); box.append(c, foot); pagesEl.appendChild(box);
    }
  }
  function downloadBlob(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  document.getElementById('downloadAll').addEventListener('click', async () => {
    if (!pageList.length) return alert('Add a salted comment first.');
    const zip = new JSZip();
    for (const p of pageList) zip.file(p.file, await new Promise(r => p.canvas.toBlob(r, 'image/png')));
    downloadBlob(await zip.generateAsync({ type: 'blob' }), 'Salted Comments.zip');
  });

  let timer;
  function changed(now) { save(); clearTimeout(timer); timer = setTimeout(renderPages, now ? 0 : 250); }

  renderEditor();
  Promise.all([
    document.fonts.load(`800 40px ${FONT}`), document.fonts.load(`700 40px ${FONT}`), document.fonts.load(`italic 700 40px ${FONT}`),
    new Promise(r => { if (bg.complete) r(); else { bg.onload = r; bg.onerror = r; } })
  ]).then(renderPages, renderPages);
})();
</script>
</body>
</html>
